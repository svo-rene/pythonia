<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pythonia">
  <title>Pythonia</title>
  <defs>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e09a2a"/>
    </linearGradient>
    <radialGradient id="cave" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3a2a63"/>
      <stop offset="1" stop-color="#140f22"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Höhlentor -->
  <path d="M8 61 V29 A24 24 0 0 1 56 29 V61 Z" fill="#2a2140" stroke="url(#gate)" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M15 61 V31 A17 17 0 0 1 49 31 V61 Z" fill="url(#cave)"/>
  <!-- Verzweigung: ein Weg teilt sich (if/else) und läuft oben wieder zusammen -->
  <g filter="url(#glow)" stroke="#b48bff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M32 58 V47"/>
    <path d="M32 47 L22 37 L32 25"/>
    <path d="M32 47 L42 37 L32 25"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="32" cy="58" r="2.4" fill="#ffcc4d"/>
    <circle cx="32" cy="47" r="3" fill="#7ee0c3"/>
    <circle cx="22" cy="37" r="2.6" fill="#b48bff"/>
    <circle cx="42" cy="37" r="2.6" fill="#b48bff"/>
    <!-- Stern am Ziel -->
    <path d="M32 15.5 L34.3 21.2 L40.2 21.6 L35.6 25.3 L37.1 31 L32 27.8 L26.9 31 L28.4 25.3 L23.8 21.6 L29.7 21.2 Z" fill="#ffcc4d" stroke="#fff3c4" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
</svg>
